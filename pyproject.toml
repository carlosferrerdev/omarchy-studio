[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-studio"
version = "0.1.0"
description = "Omarchy shell plugin and read-only professional audio diagnostics"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
omarchy-studio = "omarchy_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
