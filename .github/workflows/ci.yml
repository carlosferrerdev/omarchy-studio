name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout reviewed official plugin contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: omacom/omarchy
          ref: 0534987009061cbe2dacdde4ad564092ab698d12 # v4.0.3
          path: upstream-omarchy
          persist-credentials: false
          sparse-checkout: bin/omarchy-plugin-validate
          sparse-checkout-cone-mode: false
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: CLI and official manifest integration tests
        env:
          OMARCHY_UPSTREAM: ${{ github.workspace }}/upstream-omarchy
        run: python -m unittest discover -s tests/integration -v
      - name: Shell syntax
        run: bash -n bin/studio-doctor-terminal
